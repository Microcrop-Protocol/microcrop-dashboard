name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Lint, typecheck, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (zero warnings)
        run: npm run lint

      # `build` runs `tsc -b && vite build`, so this also gates the typecheck.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test
